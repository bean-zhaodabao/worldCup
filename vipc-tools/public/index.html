<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>竞彩足球赛事 · 实时看板</title>
<style>
  :root {
    --bg: #0f1420;
    --card: #1a2130;
    --card-hover: #202a3d;
    --border: #2a3448;
    --text: #e6ebf5;
    --muted: #8a94a8;
    --red: #ff5a5a;
    --green: #2ecc8f;
    --orange: #ffa940;
    --blue: #4da3ff;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 40px;
  }
  header {
    position: sticky; top: 0; z-index: 20;
    background: rgba(15, 20, 32, .92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  header h1 { font-size: 18px; font-weight: 600; letter-spacing: .5px; }
  header h1 .dot { color: var(--orange); }
  .status { font-size: 12px; color: var(--muted); }
  .status .live { color: var(--green); font-weight: 600; }
  .status .err { color: var(--red); }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 20px 16px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    cursor: pointer;
    transition: transform .12s, border-color .12s, background .12s;
    position: relative;
  }
  .card:hover { background: var(--card-hover); border-color: var(--blue); transform: translateY(-2px); }
  .card .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .card .teams { font-size: 15px; font-weight: 600; line-height: 1.4; }
  .card .teams .vs { color: var(--muted); font-weight: 400; margin: 0 4px; }
  .card .meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .card .chg, .card .state {
    flex-shrink: 0; font-size: 11px;
    border-radius: 20px; padding: 3px 10px; white-space: nowrap;
  }
  .card .chg { color: var(--orange); background: rgba(255,169,64,.12); border: 1px solid rgba(255,169,64,.35); }
  .card .state.upcoming { color: var(--muted); background: rgba(255,255,255,.04); border: 1px solid var(--border); }
  .card .state.live { color: var(--green); background: rgba(46,204,143,.1); border: 1px solid rgba(46,204,143,.45); }
  .card .state.finished { color: var(--blue); background: rgba(77,163,255,.1); border: 1px solid rgba(77,163,255,.4); }
  .card .score-row { margin-top: 10px; font-size: 14px; font-weight: 600; }
  .card .score-row b { margin: 0 6px; }
  .card .score-row .st { font-size: 11px; font-weight: 400; color: var(--muted); margin-left: 6px; }
  .card .foot { display: flex; justify-content: flex-end; margin-top: 12px; font-size: 12px; color: var(--muted); border-top: 1px dashed var(--border); padding-top: 10px; }
  .card .click-hint { font-size: 11px; color: #566080; }
  .dates { display: flex; gap: 6px; margin-left: auto; }
  .dates button {
    background: transparent; color: var(--muted); border: 1px solid var(--border);
    border-radius: 16px; padding: 4px 14px; font-size: 12px; cursor: pointer;
  }
  .dates button.active { color: var(--text); border-color: var(--blue); background: rgba(77,163,255,.12); }
  .empty { color: var(--muted); text-align: center; padding: 60px 0; }
  .loading .card { opacity: .5; pointer-events: none; }

  /* 详情弹窗 */
  .mask {
    position: fixed; inset: 0; z-index: 50; display: none;
    background: rgba(5,8,15,.72);
    justify-content: center; align-items: flex-start; padding: 40px 16px;
    overflow-y: auto;
  }
  .mask.show { display: flex; }
  .modal {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    width: 100%; max-width: 860px;
    animation: pop .18s ease;
  }
  @keyframes pop { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
  .modal-head {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 18px 22px; border-bottom: 1px solid var(--border); gap: 12px;
  }
  .modal-head .htitle { font-size: 17px; font-weight: 600; }
  .modal-head .hmeta { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .modal-head .close { background: none; border: none; color: var(--muted); font-size: 22px; cursor: pointer; line-height: 1; }
  .modal-head .close:hover { color: var(--text); }
  .score { display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 700; margin-top: 10px; }
  .score .st {
    font-size: 12px; font-weight: 400; color: var(--orange);
    background: rgba(255,169,64,.14); border: 1px solid rgba(255,169,64,.4);
    padding: 2px 10px; border-radius: 20px;
  }
  .modal-body { padding: 18px 22px; }
  .sec { margin-bottom: 20px; }
  .sec h3 { font-size: 13px; color: var(--muted); font-weight: 600; margin-bottom: 10px; letter-spacing: .5px; }
  .info-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px 16px; }
  .info-grid div { font-size: 12.5px; }
  .info-grid div span:first-child { color: var(--muted); margin-right: 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { padding: 7px 8px; text-align: center; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 11.5px; background: rgba(255,255,255,.02); }
  td.left, th.left { text-align: left; }
  .chg-mini { font-size: 11px; color: var(--orange); font-weight: 400; }
  .bf-wrap { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .bf-group { border: 1px solid var(--border); border-radius: 8px; padding: 8px; }
  .bf-gh { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
  .bf-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 5px; }
  .bf-item { background: rgba(255,255,255,.04); border-radius: 5px; padding: 5px 3px; text-align: center; }
  .bf-item .bf-label { font-size: 11px; color: var(--muted); }
  .bf-item .bf-odds { font-size: 12.5px; font-weight: 600; margin-top: 2px; }
  .bf-item.win .bf-odds { color: var(--red); }
  .bf-item.lose .bf-odds { color: var(--green); }
  @media (max-width: 700px) { .bf-wrap { grid-template-columns: 1fr; } }
  .up { color: var(--red); } .down { color: var(--green); } .flat { color: var(--muted); }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 12.5px; }
  .bar-row .bname { width: 92px; color: var(--muted); text-align: right; flex-shrink: 0; }
  .bar-row .barwrap { flex: 1; display: flex; gap: 2px; height: 16px; }
  .bar-row .barwrap .seg { position: relative; border-radius: 3px; min-width: 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 10.5px; }
  .bar-row .bval { width: 150px; color: var(--text); flex-shrink: 0; }
  .err-box { color: var(--red); font-size: 13px; padding: 12px; }
  .modal-foot { padding: 12px 22px 16px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .modal-foot a { color: var(--blue); text-decoration: none; }
  .modal-foot a:hover { text-decoration: underline; }
  @media (max-width: 640px) {
    .score { font-size: 22px; }
    .bar-row .bval { width: 110px; }
  }
</style>
</head>
<body>
<header>
  <h1><span class="dot">◆</span> 竞彩足球赛事看板</h1>
  <div class="status">
    <span id="stLive" class="live">● 实时</span>
    &nbsp; 数据更新时间 <span id="stTime">--</span> · 共 <span id="stCount">0</span> 场 · 刷新倒计时 <span id="stCd">--</span>s
  </div>
  <div class="dates">
    <button id="btnToday" class="active" onclick="setDate('today')">今天</button>
    <button id="btnTom" onclick="setDate('tomorrow')">明天</button>
    <button id="btnAfterTom" onclick="setDate('aftertomorrow')">后天</button>
  </div>
  <div class="status" id="stErr" style="display:none"></div>
</header>

<div class="wrap">
  <div id="grid" class="grid"><div class="empty">加载中…</div></div>
</div>

<!-- 详情弹窗 -->
<div class="mask" id="mask">
  <div class="modal">
    <div class="modal-head">
      <div>
        <div class="htitle" id="mTitle">--</div>
        <div class="hmeta" id="mMeta">--</div>
      </div>
      <button class="close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" id="mBody">
      <div class="err-box">加载中…</div>
    </div>
    <div class="modal-foot">
      <span id="mFoot">--</span>
      <a id="mLink" href="#" target="_blank" rel="noopener">打开原站详情页 ↗</a>
    </div>
  </div>
</div>

<script>
const SELF = location.origin;
const POLL_MS = 10000;          // 列表轮询
const COUNTDOWN_MS = 10;        // 倒计时秒数（展示用）

let listData = [];
let cd = COUNTDOWN_MS;
let currentMatch = null;
let curDate = 'today';          // 当前查看的日期：'today' 或 'YYYY-MM-DD'（明天/后天）

/* ---------------- 工具 ---------------- */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// 状态徽章样式：未开始 / 进行中 / 完场
function stateCls(s) {
  if (!s || s === '未开始') return 'upcoming';
  if (s === '完场' || s.includes('结束')) return 'finished';
  return 'live';
}
// 今天的 YYYY-MM-DD
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
// N 天后的 YYYY-MM-DD（1=明天，2=后天）
function dayStr(offset) {
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

/* ---------------- 解析 vipc 列表原始 JSON ---------------- */
// 结构（见 public/test.json）: { prev, next, items: [{date, dateDesc, matches: [{type, model, room}]}] }
// 接口按日期分组（today 会带上昨天已完场的），这里只取请求日期当天的分组
function parseVipcList(json, reqDate) {
  const items = Array.isArray(json.items) ? json.items : [];
  const concrete = reqDate === 'today' ? todayStr() : reqDate;
  let groups = items.filter((it) => it.date === concrete);
  if (!groups.length) groups = items; // 没匹配到说明结构变了，退回全部，避免静默变空

  const seen = new Set();
  const list = [];
  for (const g of groups) {
    for (const m of g.matches || []) {
      const model = m && m.model;
      if (!model || model.matchId == null) continue;
      const id = String(model.matchId);
      if (seen.has(id)) continue;
      seen.add(id);
      list.push({
        matchId: id,
        home: model.home || '',
        guest: model.guest || '',
        league: model.leagueName || model.league || '',
        time: model.matchTime || '',
        no: model.bdIssue || '',
        displayState: model.displayState || '',
        homeScore: model.homeScore,
        guestScore: model.guestScore,
      });
    }
  }
  // 排序：未开始/进行中在前（按开赛时间），完场/推迟在后
  const PRIO = { '未开始': 0, '完场': 2, '推迟': 2 };
  const prio = (s) => (s in PRIO ? PRIO[s] : 1);
  return list.sort((a, b) => {
    const pa = prio(a.displayState), pb = prio(b.displayState);
    if (pa !== pb) return pa - pb;
    return (a.time || '').localeCompare(b.time || '');
  });
}

/* ---------------- 列表渲染 ---------------- */
function renderList() {
  const grid = document.getElementById('grid');
  if (!listData.length) {
    grid.innerHTML = '<div class="empty">暂无数据</div>';
    return;
  }
  grid.innerHTML = listData.map((m) => {
    const meta = [m.no, m.league, (m.time || '').slice(5, 16)].filter(Boolean).map(esc).join(' · ');
    // 未开始的比赛没有比分，不展示 score 行
    const scoreRow = (m.displayState && m.displayState !== '未开始')
      ? `<div class="score-row">${esc(m.home)} <b>${m.homeScore != null ? esc(m.homeScore) : '-'} - ${m.guestScore != null ? esc(m.guestScore) : '-'}</b> ${esc(m.guest)}</div>`
      : '';
    return `
    <div class="card" onclick="openDetail('${m.matchId}')">
      <div class="top">
        <div>
          <div class="teams">${esc(m.home)} <span class="vs">vs</span> ${esc(m.guest)}</div>
          <div class="meta">${meta}</div>
        </div>
        <span class="state ${stateCls(m.displayState)}">${esc(m.displayState || '待定')}</span>
      </div>
      ${scoreRow}
      <div class="foot">
        <span class="click-hint">点击查看详情 →</span>
      </div>
    </div>
  `;
  }).join('');
}

/* ---------------- 数据轮询 ---------------- */
function setDate(v) {
  curDate = v === 'today' ? 'today' : dayStr(v === 'tomorrow' ? 1 : 2);
  document.getElementById('btnToday').classList.toggle('active', v === 'today');
  document.getElementById('btnTom').classList.toggle('active', v === 'tomorrow');
  document.getElementById('btnAfterTom').classList.toggle('active', v === 'aftertomorrow');
  pollList();
}
async function pollList() {
  const grid = document.getElementById('grid');
  grid.classList.add('loading');
  try {
    // vipc 无 CORS 头浏览器不能直连，改走本地 /i/** 透传（路径与 vipc 官方接口完全一致）
    const url = `${location.origin}/i/live/jczq/date/${curDate}/next?_=${Date.now()}`;
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) {
      const err = await res.json().catch(() => null);
      throw new Error((err && err.error) || ('HTTP ' + res.status));
    }
    const json = await res.json();
    listData = parseVipcList(json, curDate);
    document.getElementById('stTime').textContent = new Date().toLocaleTimeString('zh-CN', { hour12: false });
    document.getElementById('stCount').textContent = listData.length;
    document.getElementById('stErr').style.display = 'none';
    renderList();
    // 若当前打开的详情对应的比赛还在列表里，顺手更新一下缓存视角
    if (currentMatch) { /* 详情数据已缓存，无需重拉 */ }
  } catch (e) {
    document.getElementById('stErr').style.display = 'block';
    document.getElementById('stErr').textContent = '⚠ ' + e.message;
  } finally {
    grid.classList.remove('loading');
  }
}

/* ---------------- 详情弹窗 ---------------- */
async function openDetail(id) {
  const mask = document.getElementById('mask');
  const body = document.getElementById('mBody');
  mask.classList.add('show');
  currentMatch = id;
  body.innerHTML = '<div class="err-box">加载中…</div>';
  document.getElementById('mTitle').textContent = '场次 #' + id;
  document.getElementById('mLink').href = `https://www.vipc.cn/live/football/${id}`;

  try {
    const res = await fetch(SELF + '/api/match/' + id, { cache: 'no-store' });
    const d = await res.json();
    if (!d.ok) throw new Error(d.error || '详情接口异常');
    renderDetail(d);
  } catch (e) {
    body.innerHTML = '<div class="err-box">加载失败：' + esc(e.message) + '</div>';
  }
}
function closeModal() { document.getElementById('mask').classList.remove('show'); currentMatch = null; }
document.getElementById('mask').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

/* ---------------- 竞彩玩法渲染（sporttery 接口） ---------------- */

// 胜平负 / 让球胜平负：即时 + 初赔 + 全部变化历史
function playTableHtml(title, obj, goal) {
  if (!obj) return '';
  // 竞彩官方编码：3=胜(主胜) 1=平 0=负(客胜)，rqspf 的 rq0/rq1/rq3 同理。
  // 注意：rq0/spf0 等键不在顶层，而在 odds 数组每条记录里，所以从第一条记录判断玩法
  const sample = (obj.odds && obj.odds.length) ? obj.odds[0] : obj;
  const keys = sample.rq0 != null
    ? [{ n: '让球胜', k: 'rq3' }, { n: '让球平', k: 'rq1' }, { n: '让球负', k: 'rq0' }]
    : [{ n: '胜', k: 'spf3' }, { n: '平', k: 'spf1' }, { n: '负', k: 'spf0' }];
  const odds = obj.odds || [];
  const cur = odds.length ? odds[odds.length - 1] : obj;
  const ini = odds.length ? odds[0] : null;

  return `<div class="sec">
    <h3>${title}${goal ? `（让球 ${esc(String(goal).replace(/\.0+$/, ''))}）` : ''} <span class="chg-mini">变动 ${esc(obj.changeCount != null ? obj.changeCount : 0)} 次</span></h3>
    <table>
      <thead><tr><th></th>${keys.map((k) => `<th>${k.n}</th>`).join('')}</tr></thead>
      <tbody>
        <tr><td class="left">即时赔率</td>${keys.map((k) => `<td><b>${esc(cur[k.k] != null ? cur[k.k] : '-')}</b></td>`).join('')}</tr>
        <tr><td class="left">初始赔率</td>${keys.map((k) => `<td>${ini && ini[k.k] != null ? esc(ini[k.k]) : (obj.frist != null ? esc(obj.frist) : '-')}</td>`).join('')}</tr>
        ${odds.length ? `<tr><td class="left" colspan="${keys.length + 1}" style="background:rgba(255,255,255,.03)">赔率变化历史（最新在上）</td></tr>` + [...odds].reverse().map((o) => `<tr>
          <td class="left">${esc(o.updateTime || '')}</td>
          ${keys.map((k) => `<td>${o[k.k] != null ? esc(o[k.k]) : '-'}</td>`).join('')}
        </tr>`).join('') : ''}
      </tbody>
    </table>
  </div>`;
}

// 比分：胜 / 平 / 负 三组
function bfHtml(bf) {
  if (!bf) return '';
  const groups = [
    { title: '主胜', cls: 'win', list: [['sw10', '1:0'], ['sw20', '2:0'], ['sw21', '2:1'], ['sw30', '3:0'], ['sw31', '3:1'], ['sw32', '3:2'], ['sw40', '4:0'], ['sw41', '4:1'], ['sw42', '4:2'], ['sw50', '5:0'], ['sw51', '5:1'], ['sw52', '5:2'], ['sw5', '胜其他']] },
    { title: '平局', cls: 'draw', list: [['sd00', '0:0'], ['sd11', '1:1'], ['sd22', '2:2'], ['sd33', '3:3'], ['sd4', '平其他']] },
    { title: '主负', cls: 'lose', list: [['sl01', '0:1'], ['sl02', '0:2'], ['sl12', '1:2'], ['sl03', '0:3'], ['sl13', '1:3'], ['sl23', '2:3'], ['sl04', '0:4'], ['sl14', '1:4'], ['sl24', '2:4'], ['sl05', '0:5'], ['sl15', '1:5'], ['sl25', '2:5'], ['sl5', '负其他']] },
  ];
  return `<div class="sec"><h3>比分</h3><div class="bf-wrap">` + groups.map((g) => `
    <div class="bf-group">
      <div class="bf-gh">${g.title}</div>
      <div class="bf-grid">${g.list.map(([k, label]) => bf[k] != null ? `
        <div class="bf-item ${g.cls}"><div class="bf-label">${label}</div><div class="bf-odds">${esc(bf[k])}</div></div>` : '').join('')}
      </div>
    </div>`).join('') + `</div></div>`;
}

// 半全场
function bqcHtml(bqc) {
  if (!bqc) return '';
  const map = [['ht00', '胜/胜'], ['ht01', '胜/平'], ['ht03', '胜/负'], ['ht10', '平/胜'], ['ht11', '平/平'], ['ht13', '平/负'], ['ht30', '负/胜'], ['ht31', '负/平'], ['ht33', '负/负']];
  return `<div class="sec"><h3>半全场</h3><div class="bf-grid">` + map.map(([k, label]) =>
    bqc[k] != null ? `<div class="bf-item"><div class="bf-label">${label}</div><div class="bf-odds">${esc(bqc[k])}</div></div>` : ''
  ).join('') + `</div></div>`;
}

// 总进球
function jqHtml(jq) {
  if (!jq) return '';
  const map = [['t0', '0球'], ['t1', '1球'], ['t2', '2球'], ['t3', '3球'], ['t4', '4球'], ['t5', '5球'], ['t6', '6球'], ['t7', '7+球']];
  return `<div class="sec"><h3>总进球</h3><div class="bf-grid">` + map.map(([k, label]) =>
    jq[k] != null ? `<div class="bf-item"><div class="bf-label">${label}</div><div class="bf-odds">${esc(jq[k])}</div></div>` : ''
  ).join('') + `</div></div>`;
}

function renderSporttery(st) {
  if (!st) return '<div class="err-box">竞彩玩法数据未返回</div>';
  return (playTableHtml('胜平负', st.spf) || '') +
         (playTableHtml('让球胜平负', st.rqspf, st.goal) || '') +
         bfHtml(st.bf) + bqcHtml(st.bqc) + jqHtml(st.jq);
}

function renderDetail(d) {
  // base 接口返回 {type, model:{...}}，比赛字段都在 model 里；保留 d.base 兜底防结构变化
  const b = (d.base && d.base.model) || d.base || {};
  const body = document.getElementById('mBody');

  const home = b.home || '--', guest = b.guest || '--';
  const homeScore = b.homeScore != null ? b.homeScore : '--';
  const guestScore = b.guestScore != null ? b.guestScore : '--';
  const isFinished = b.displayState === '完场';
  const hasScore = homeScore !== '--';

  document.getElementById('mTitle').textContent = `${home} VS ${guest}`;
  document.getElementById('mMeta').textContent =
    `${b.displayTime || ''} · ${b.leagueNameV || b.league || ''} · ${b.displayState || ''}${b.matchTime ? ' · ' + b.matchTime : ''}`;

  let scoreHtml = '';
  if (hasScore) {
    scoreHtml = `<div class="score">${esc(home)} <b>${homeScore} - ${guestScore}</b> ${esc(guest)} <span class="st">${esc(b.displayState || '')}</span></div>`;
  }

  // 基本信息
  const info = [
    ['联赛', b.leagueNameV || b.league], ['赛季', b.season], ['轮次', b.round],
    ['主队排名', b.homeRank], ['客队排名', b.guestRank],
    ['期号', b.bdIssue || b.issue], ['开赛', b.matchTime], ['状态', b.displayState],
  ].filter(([, v]) => v != null && v !== '').map(([k, v]) => `<div><span>${esc(k)}</span>${esc(v)}</div>`).join('');

  // 竞彩官方玩法（胜平负/让球/比分/半全场/总进球）
  const sportteryHtml = renderSporttery(d.sporttery);

  // 技术统计
  let techHtml = '';
  if (d.live && d.live.technic && d.live.technic.length) {
    const bars = d.live.technic.map((t) => {
      const hP = t.homePercent || 0, gP = t.guestPercent || 0;
      const name = esc(t.name);
      return `<div class="bar-row">
        <span class="bname">${name}</span>
        <div class="barwrap">
          <div class="seg" style="width:${hP}%;background:#3d6fb4;">${t.home != null ? esc(t.home) : ''}</div>
          <div class="seg" style="width:${gP}%;background:#e04a4a;">${t.guest != null ? esc(t.guest) : ''}</div>
        </div>
        <span class="bval">主 ${esc(t.home)} · 客 ${esc(t.guest)}</span>
      </div>`;
    }).join('');
    techHtml = `<div class="sec"><h3>技术统计（${esc(d.live.displayState || '')}）</h3>${bars}</div>`;
  }

  const desc = b.description ? `<div class="sec" style="font-size:12.5px;color:var(--muted)">📌 ${esc(b.description)}</div>` : '';
  const errs = d.errors && d.errors.length
    ? `<div class="err-box">部分接口失败：${esc(d.errors.join('；'))}</div>` : '';

  body.innerHTML = scoreHtml + desc +
    `<div class="sec"><h3>基本信息</h3><div class="info-grid">${info}</div></div>` +
    sportteryHtml + techHtml + errs;

  const foot = document.getElementById('mFoot');
  foot.textContent = `数据抓取时间 ${new Date(d.fetchedAt).toLocaleTimeString('zh-CN', { hour12: false })}（本地缓存 60s）`;
}

/* ---------------- 定时器 ---------------- */
setInterval(pollList, POLL_MS);
setInterval(() => {
  cd = cd <= 1 ? COUNTDOWN_MS : cd - 1;
  document.getElementById('stCd').textContent = cd;
}, 1000);

pollList();
</script>
</body>
</html>
